name: Deploy to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run cancels an older one instead of failing with "in progress deployment"
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate F1, WEC and MotoGP calendars
        run: |
          pip install motorsport-calendar
          mkdir -p calendars
          YEAR=$(date +%Y)
          motocal generate-f1 "$YEAR" calendars/f1.ics || echo "F1 generation failed"
          motocal generate-wec "$YEAR" calendars/wec.ics || echo "WEC generation failed"
          motocal generate-motogp "$YEAR" calendars/motogp.ics || echo "MotoGP generation failed"
      - run: node scripts/fetch-feeds.mjs
      - run: npm run fetch
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
